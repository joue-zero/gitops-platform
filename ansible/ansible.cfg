[defaults]
inventory           = inventory/aws_ec2.yml
private_key_file    = ~/.ssh/gitops-platform
remote_user         = ubuntu
host_key_checking   = False
retry_files_enabled = False

[ssh_connection]
ssh_args   = -o StrictHostKeyChecking=no -o ControlMaster=auto -o ControlPersist=60s
pipelining = True