---
- name: Install AWS CLI (for ECR auth)
  ansible.builtin.apt:
    name: awscli
    state: present

# The EC2 instance profile already has AmazonEC2ContainerRegistryReadOnly,
# so this uses instance metadata credentials — no keys needed on the box.
- name: Log in to Amazon ECR
  ansible.builtin.shell: |
    set -o pipefail
    aws ecr get-login-password --region {{ aws_region }} \
      | docker login --username AWS --password-stdin {{ ecr_repository_url.split('/')[0] }}
  args:
    executable: /bin/bash
  changed_when: false

- name: Pull application image
  ansible.builtin.command: docker pull {{ ecr_repository_url }}:{{ image_tag }}
  register: pull_result
  changed_when: "'Downloaded newer image' in pull_result.stdout"

- name: Remove existing app container
  ansible.builtin.command: docker rm -f app
  register: rm_result
  changed_when: rm_result.rc == 0
  failed_when: false

- name: Run application container
  ansible.builtin.command: >
    docker run -d --name app --restart unless-stopped
    -p {{ app_port }}:{{ app_port }}
    {{ ecr_repository_url }}:{{ image_tag }}
  changed_when: true
