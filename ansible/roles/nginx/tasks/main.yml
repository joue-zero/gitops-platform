---
- name: Install Nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: yes

- name: Start and enable Nginx
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: yes

- name: Deploy Nginx reverse proxy config
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/sites-available/app
    mode: '0644'
  notify: restart nginx

- name: Enable site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/app
    dest: /etc/nginx/sites-enabled/app
    state: link
  notify: restart nginx

# Ubuntu's stock default site has `listen 80 default_server;`, which
# wins as the fallback for any request whose Host header matches no
# server_name -- exactly the ALB's health check. Without removing it,
# our site (server_name _, no default_server flag) never gets hit.
- name: Disable default Nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: restart nginx
