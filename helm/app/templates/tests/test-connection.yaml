apiVersion: v1
kind: Pod
metadata:
  name: {{ include "gitops-app.fullname" . }}-test-connection
  labels:
    {{- include "gitops-app.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: wget
      image: {{ .Values.testImage | quote }}
      command: ["wget"]
      args:
        - "-qO-"
        - "--timeout=5"
        - "http://{{ include "gitops-app.fullname" . }}:{{ .Values.service.port }}/health"
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
