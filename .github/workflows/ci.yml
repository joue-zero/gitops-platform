name: CI — Build and push to ECR

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/ci.yml'
  # Lets you re-run build+push+deploy on demand — e.g. after recreating
  # the dev environment, when there's nothing new to push but the app
  # still needs to land on the fresh EC2 instances.
  workflow_dispatch: {}

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_URL }}

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: app/package-lock.json

    - name: Install dependencies
      run: npm ci
      working-directory: app

    - name: Run tests
      run: npm test
      working-directory: app

  build-and-push:
    name: Build, test, push
    runs-on: ubuntu-latest
    needs: test
    # Required for OIDC token generation
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Auth ───────────────────────────────────────────
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/gitops-platform-github-role
          aws-region: ${{ env.AWS_REGION }}

      # ── ECR Login ──────────────────────────────────────
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ── Layer cache setup ──────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Build + Push ───────────────────────────────────
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./app/Dockerfile
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}   # push on merge or manual run, not PR
          # Only the immutable SHA tag — the repo has
          # image_tag_mutability = IMMUTABLE, so a rolling `:latest`
          # tag can never be re-pushed after the first build ever
          # creates it. The deploy step always pins an exact SHA
          # anyway, so `:latest` was dead weight that broke every
          # build after the first.
          tags: ${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha                        # GitHub Actions layer cache
          cache-to:   type=gha,mode=max

      # ── Output the image URI for downstream jobs ───────
      - name: Output image URI
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          echo "IMAGE=${{ env.ECR_REPOSITORY }}:${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "Pushed: ${{ env.ECR_REPOSITORY }}:${{ github.sha }}"

  deploy:
    name: Deploy to app server
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/gitops-platform-github-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Ansible
        run: pipx install --include-deps ansible

      - name: Install boto3/botocore (required by the aws_ec2 inventory plugin)
        run: |
          # `pipx inject ansible` isn't reliable here: this runner image
          # ships a separate pre-installed ansible-core pipx venv, and
          # that's the interpreter actually used at runtime — injecting
          # into the "ansible" venv we just installed doesn't reach it.
          # Find whichever interpreter ansible-playbook actually uses
          # and pip-install straight into it instead of guessing a name.
          ANSIBLE_PYTHON=$(ansible --version | grep 'python version' | sed -E 's/.*\(([^)]+)\)[^)]*$/\1/')
          echo "ansible's python interpreter: $ANSIBLE_PYTHON"
          "$ANSIBLE_PYTHON" -m pip install boto3 botocore

      - name: Install amazon.aws collection (EC2 dynamic inventory)
        run: ansible-galaxy collection install amazon.aws

      - name: Set up bastion SSH key
        run: |
          install -m 600 -D /dev/null ~/.ssh/gitops-platform
          echo "${{ secrets.BASTION_SSH_PRIVATE_KEY }}" > ~/.ssh/gitops-platform

      - name: Verify inventory actually resolves app servers
        working-directory: ansible
        run: |
          count=$(ansible-inventory --list | python3 -c "import json,sys; print(len(json.load(sys.stdin).get('app_server', {}).get('hosts', [])))")
          echo "Found $count app_server host(s)"
          test "$count" -gt 0

      - name: Run deploy playbook
        working-directory: ansible
        run: |
          ansible-playbook playbooks/app_servers.yml \
            -e ecr_repository_url=${{ env.ECR_REPOSITORY }} \
            -e image_tag=${{ github.sha }} \
            -e aws_region=${{ env.AWS_REGION }}

  update-gitops:
    name: Update image tag in the GitOps repo
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    # Serialise writers so an older run can never overwrite a newer tag.
    concurrency:
      group: gitops-config-update
      cancel-in-progress: false
    permissions:
      contents: read

    steps:
      - name: Require the GitOps repo token
        env:
          TOKEN: ${{ secrets.GITOPS_CONFIG_TOKEN }}
        run: |
          [ -n "$TOKEN" ] || { echo "::error::GITOPS_CONFIG_TOKEN is not set (fine-grained token, contents: write on gitops-platform-config)"; exit 1; }

      - uses: actions/checkout@v4
        with:
          repository: joue-zero/gitops-platform-config
          token: ${{ secrets.GITOPS_CONFIG_TOKEN }}
          ref: main

      - name: Set image.tag
        run: |
          sed -E "s|^(  tag: )[0-9a-f]{40}|\1${GITHUB_SHA}|" envs/dev/values.yaml > values.tmp
          mv values.tmp envs/dev/values.yaml
          grep -q "^  tag: ${GITHUB_SHA}" envs/dev/values.yaml

      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo "Already at ${GITHUB_SHA}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Deploy ${GITHUB_SHA::7} to dev" \
            -m "Source: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1
