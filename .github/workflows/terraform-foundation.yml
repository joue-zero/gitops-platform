name: Terraform Foundation — Plan and Apply

on:
  pull_request:
    branches: [main]
    paths:
      - 'terraform/environments/foundation/**'
      - 'terraform/modules/foundation-iam/**'
      - 'terraform/modules/ecr/**'
      - '.github/workflows/terraform-foundation.yml'
  push:
    branches: [main]
    paths:
      - 'terraform/environments/foundation/**'
      - 'terraform/modules/foundation-iam/**'
      - 'terraform/modules/ecr/**'
      - '.github/workflows/terraform-foundation.yml'

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_WORKING_DIR: terraform/environments/foundation

jobs:
  plan:
    name: Terraform Plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/gitops-platform-tf-plan-role
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - run: terraform init -input=false
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: bash # adds pipefail, so a failed plan is not masked by tee
        run: terraform plan -input=false -no-color | tee plan_output.txt

      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ env.TF_WORKING_DIR }}/plan_output.txt', 'utf8').slice(-60000);
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `#### Terraform Foundation Plan\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`
            });

  apply:
    name: Terraform Apply
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: terraform-foundation
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/gitops-platform-foundation-apply-role
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - run: terraform init -input=false
        working-directory: ${{ env.TF_WORKING_DIR }}

      - run: terraform apply -auto-approve -input=false
        working-directory: ${{ env.TF_WORKING_DIR }}
