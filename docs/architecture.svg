<svg viewBox="0 0 1280 990" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">gitops-platform architecture</title>
  <desc id="desc">GitHub Actions builds and pushes images to ECR via OIDC, then deploys over SSH through a bastion to an app EC2 instance inside a private subnet, which talks to RDS Postgres in a data subnet. All inbound traffic is bounded by security groups; Terraform state lives in S3 with native locking.</desc>

  <defs>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="990" fill="#ffffff"/>
  <rect x="1" y="1" width="1278" height="988" fill="none" stroke="#e2e8f0" stroke-width="2" rx="10"/>

  <!-- Font baseline -->
  <g font-family="Helvetica, Arial, sans-serif" fill="#0f172a">

    <!-- ── Top actors ─────────────────────────────────── -->
    <rect x="40" y="30" width="150" height="50" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
    <text x="115" y="60" font-size="13" text-anchor="middle">Developer</text>

    <rect x="230" y="30" width="230" height="50" rx="6" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
    <text x="345" y="55" font-size="13" text-anchor="middle" font-weight="bold">GitHub Actions</text>
    <text x="345" y="70" font-size="11" text-anchor="middle">CI/CD (OIDC, no long-lived keys)</text>

    <rect x="1080" y="30" width="160" height="50" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
    <text x="1160" y="60" font-size="13" text-anchor="middle">Admin (you)</text>

    <line x1="190" y1="55" x2="223" y2="55" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
    <text x="207" y="45" font-size="10" text-anchor="middle">push</text>

    <!-- ── AWS account boundary ───────────────────────── -->
    <rect x="20" y="110" width="1240" height="800" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4" rx="8"/>
    <text x="36" y="130" font-size="12" fill="#475569" font-style="italic">AWS Account · eu-central-1</text>

    <rect x="230" y="150" width="230" height="60" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
    <text x="345" y="175" font-size="13" text-anchor="middle" font-weight="bold">Amazon ECR</text>
    <text x="345" y="192" font-size="11" text-anchor="middle">app image, immutable tags</text>

    <rect x="940" y="150" width="280" height="60" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
    <text x="1080" y="172" font-size="13" text-anchor="middle" font-weight="bold">Amazon S3</text>
    <text x="1080" y="189" font-size="11" text-anchor="middle">terraform state + native lock</text>
    <text x="1080" y="225" font-size="10" text-anchor="middle" fill="#64748b" font-style="italic">written by `terraform apply` (local CLI)</text>

    <line x1="345" y1="80" x2="345" y2="148" stroke="#0d9488" stroke-width="1.5" marker-end="url(#arrow-teal)"/>
    <text x="352" y="102" font-size="10">push image</text>
    <text x="352" y="115" font-size="10">(OIDC, git-sha + latest)</text>

    <!-- CI deploy path: GitHub Actions -> Bastion, routed along the right edge -->
    <polyline points="460,55 1230,55 1230,380 972,380" fill="none" stroke="#0d9488" stroke-width="1.5" marker-end="url(#arrow-teal)"/>
    <text x="1000" y="345" font-size="10" text-anchor="end">deploy: ssh via bastion</text>
    <text x="1000" y="358" font-size="10" text-anchor="end">(ansible: ecr pull + run)</text>

    <!-- Admin -> Bastion -->
    <polyline points="1160,80 1160,330 887,330 887,348" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
    <text x="1150" y="322" font-size="10" text-anchor="end">ssh :22 (sg: your-ip only)</text>

    <!-- ── VPC ─────────────────────────────────────────── -->
    <rect x="60" y="250" width="1160" height="620" fill="none" stroke="#334155" stroke-width="2" rx="8"/>
    <text x="78" y="272" font-size="12" fill="#334155" font-weight="bold">VPC · 10.0.0.0/16</text>

    <!-- Public subnet band -->
    <rect x="90" y="300" width="1100" height="170" fill="#fafafa" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="106" y="318" font-size="11" fill="#64748b">Public subnet (× 2 AZ)</text>

    <rect x="140" y="350" width="170" height="60" rx="6" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
    <text x="225" y="373" font-size="12" text-anchor="middle" font-weight="bold">Internet Gateway</text>
    <text x="225" y="389" font-size="10" text-anchor="middle">internet-facing</text>

    <rect x="350" y="350" width="170" height="60" rx="6" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
    <text x="435" y="373" font-size="12" text-anchor="middle" font-weight="bold">NAT Gateway</text>
    <text x="435" y="389" font-size="10" text-anchor="middle">egress only</text>

    <rect x="580" y="350" width="170" height="60" rx="6" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
    <text x="665" y="373" font-size="12" text-anchor="middle" font-weight="bold">ALB</text>
    <text x="665" y="389" font-size="10" text-anchor="middle">sg: 80/443 from 0.0.0.0/0</text>

    <rect x="800" y="350" width="170" height="60" rx="6" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
    <text x="885" y="373" font-size="12" text-anchor="middle" font-weight="bold">Bastion EC2</text>
    <text x="885" y="389" font-size="10" text-anchor="middle">sg: 22 from admin IP</text>

    <polyline points="270,348 270,332 610,332 610,348" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
    <text x="440" y="326" font-size="10" text-anchor="middle">80 / 443</text>

    <line x1="350" y1="397" x2="312" y2="397" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
    <text x="331" y="412" font-size="9" text-anchor="middle">to internet</text>

    <!-- Private subnet band -->
    <rect x="90" y="500" width="1100" height="150" fill="#fafafa" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="106" y="518" font-size="11" fill="#64748b">Private subnet (× 2 AZ)</text>

    <rect x="580" y="550" width="210" height="70" rx="6" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
    <text x="685" y="576" font-size="12" text-anchor="middle" font-weight="bold">App EC2</text>
    <text x="685" y="592" font-size="10" text-anchor="middle">docker run, :8080</text>
    <text x="685" y="606" font-size="10" text-anchor="middle">sg: from alb-sg + bastion-sg</text>

    <line x1="665" y1="410" x2="665" y2="548" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
    <text x="672" y="480" font-size="10">80 → 8080</text>

    <polyline points="885,410 885,490 792,490 792,548" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
    <text x="880" y="503" font-size="10" text-anchor="end">ssh :22</text>

    <polyline points="685,550 685,470 435,470 435,412" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
    <text x="500" y="463" font-size="10" text-anchor="middle">egress only (updates, ecr pull)</text>

    <!-- Data subnet band -->
    <rect x="90" y="680" width="1100" height="150" fill="#fafafa" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="106" y="698" font-size="11" fill="#64748b">Data subnet (× 2 AZ)</text>

    <rect x="580" y="730" width="210" height="70" rx="6" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
    <text x="685" y="756" font-size="12" text-anchor="middle" font-weight="bold">RDS Postgres</text>
    <text x="685" y="772" font-size="10" text-anchor="middle">single-AZ, not publicly accessible</text>
    <text x="685" y="786" font-size="10" text-anchor="middle">sg: from app-sg only</text>

    <line x1="685" y1="620" x2="685" y2="728" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
    <text x="692" y="678" font-size="10">5432</text>

    <!-- ── Legend ──────────────────────────────────────── -->
    <line x1="60" y1="900" x2="100" y2="900" stroke="#0d9488" stroke-width="2"/>
    <text x="110" y="904" font-size="11">CI/CD pipeline (build → push → deploy)</text>

    <line x1="60" y1="925" x2="100" y2="925" stroke="#475569" stroke-width="2"/>
    <text x="110" y="929" font-size="11">Runtime / network traffic (bounded by security groups)</text>

  </g>
</svg>
