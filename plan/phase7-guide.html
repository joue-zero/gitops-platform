<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phase 7 — Portfolio Polish</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Martian+Mono:wght@300;400;500;600;700&family=Cabinet+Grotesk:wght@800;900&display=swap');
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@800;900&display=swap');

:root {
  --bg:    #060608;
  --s1:    #09090E;
  --s2:    #0D0D14;
  --s3:    #12121C;
  --border:#1A1A28;
  --bord2: #252538;
  --text:  #B8B8D8;
  --muted: #282840;
  --dim:   #181828;
  --gold:  #F59E0B;
  --gold2: #FCD34D;
  --blue:  #3B82F6;
  --green: #22C55E;
  --pink:  #EC4899;
  --cyan:  #06B6D4;
  --purple:#A855F7;
  --acc:   #F59E0B;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Martian Mono', monospace; min-height: 100vh; }
::-webkit-scrollbar { width: 3px; height: 3px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--dim); border-radius: 2px; }

.shell { display: grid; grid-template-columns: 272px 1fr; min-height: 100vh; }

/* SIDEBAR */
.sidebar { background: var(--s1); border-right: 1px solid var(--border); position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
.sb-head { padding: 22px 18px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.phase-dot { display: inline-flex; align-items: center; gap: 5px; font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold2); margin-bottom: 8px; }
.phase-dot::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 8px var(--gold); }
.sb-title { font-family: 'DM Sans', sans-serif; font-size: 17px; font-weight: 900; color: #fff; line-height: 1.2; }
.sb-pills { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; }
.pill { font-size: 8px; letter-spacing: 0.08em; text-transform: uppercase; padding: 2px 7px; border-radius: 2px; border: 1px solid; }
.pill.doc   { color: var(--gold2); border-color: #4A3800; background: #120E00; }
.pill.blog  { color: var(--pink);  border-color: #4A1830; background: #120408; }
.pill.cv    { color: var(--cyan);  border-color: #0A3848; background: #020E14; }
.pill.week  { color: var(--green); border-color: #0A3818; background: #020E06; }

.prog-wrap { padding: 12px 18px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.prog-row { display: flex; justify-content: space-between; font-size: 9px; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 6px; }
.prog-track { height: 2px; background: var(--border); border-radius: 1px; }
.prog-fill { height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold2)); border-radius: 1px; transition: width 0.4s; }

.nav-scroll { flex: 1; overflow-y: auto; padding: 6px 0; }
.nav-item { display: flex; align-items: flex-start; gap: 9px; padding: 8px 18px; cursor: pointer; border-left: 2px solid transparent; transition: all 0.15s; }
.nav-item:hover { background: var(--s2); }
.nav-item.active { background: var(--s2); border-left-color: var(--gold); }
.nav-item.done .nn { background: var(--green); color: #000; }
.nn { width: 18px; height: 18px; border-radius: 2px; background: var(--dim); color: var(--muted); font-size: 9px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; transition: all 0.2s; }
.nav-item.active .nn { background: var(--gold); color: #000; }
.nt { flex: 1; min-width: 0; }
.ntitle { font-size: 11px; font-weight: 500; color: var(--text); line-height: 1.35; }
.nav-item.active .ntitle { color: #fff; }
.nsub { font-size: 9px; color: var(--muted); margin-top: 1px; }
.ntag { font-size: 8px; padding: 1px 5px; border-radius: 1px; letter-spacing: 0.04em; flex-shrink: 0; margin-top: 2px; align-self: flex-start; }
.ntag.doc   { background: #120E00; color: var(--gold2); }
.ntag.blog  { background: #120408; color: var(--pink); }
.ntag.cv    { background: #020E14; color: var(--cyan); }
.ntag.arch  { background: #0C0420; color: var(--purple); }
.ntag.loom  { background: #020A04; color: var(--green); }
.ntag.final { background: #0E0E18; color: var(--text); }

/* MAIN */
.main { display: flex; flex-direction: column; min-height: 100vh; }
.main-head { padding: 26px 36px 20px; border-bottom: 1px solid var(--border); background: var(--s1); flex-shrink: 0; }
.eyebrow { font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold2); margin-bottom: 7px; }
.headline { font-family: 'DM Sans', sans-serif; font-size: 26px; font-weight: 900; color: #fff; line-height: 1.1; margin-bottom: 8px; }
.step-desc { font-size: 12px; color: #383858; line-height: 1.9; max-width: 660px; }
.tag-row { display: flex; gap: 5px; margin-top: 12px; flex-wrap: wrap; }
.tag { font-size: 8px; letter-spacing: 0.1em; text-transform: uppercase; padding: 2px 7px; border-radius: 2px; border: 1px solid; }
.tag.doc    { color: var(--gold2); border-color: #4A3800; background: #120E00; }
.tag.arch   { color: var(--purple);border-color: #3A1870; background: #0C0420; }
.tag.blog   { color: var(--pink);  border-color: #4A1830; background: #120408; }
.tag.cv     { color: var(--cyan);  border-color: #0A3848; background: #020E14; }
.tag.loom   { color: var(--green); border-color: #0A3818; background: #020E06; }
.tag.concept{ color: var(--pink);  border-color: #4A1830; background: #120408; }

/* CONTENT */
.content { flex: 1; padding: 20px 36px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }

/* CHUNK */
.chunk { border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
.chunk-head { display: flex; align-items: center; gap: 10px; padding: 12px 15px; cursor: pointer; background: var(--s1); transition: background 0.15s; user-select: none; }
.chunk-head:hover { background: var(--s2); }
.chunk.open .chunk-head { background: var(--s2); border-bottom: 1px solid var(--border); }
.cdot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.cdot.doc    { background: var(--gold); }
.cdot.arch   { background: var(--purple); }
.cdot.blog   { background: var(--pink); }
.cdot.cv     { background: var(--cyan); }
.cdot.loom   { background: var(--green); }
.cdot.concept{ background: var(--pink); }
.cdot.check  { background: var(--green); }
.cdot.warn   { background: #EF5350; }
.clabel { flex: 1; font-size: 12px; font-weight: 500; color: #fff; line-height: 1.3; }
.cbadge { font-size: 8px; letter-spacing: 0.08em; text-transform: uppercase; padding: 2px 7px; border-radius: 2px; }
.cbadge.do     { background: #120E00; color: var(--gold2); }
.cbadge.run    { background: #020E06; color: var(--green); }
.cbadge.deep   { background: #120408; color: var(--pink); }
.cbadge.concept{ background: #120408; color: var(--pink); }
.cbadge.cv     { background: #020E14; color: var(--cyan); }
.cbadge.arch   { background: #0C0420; color: var(--purple); }
.cbadge.blog   { background: #120408; color: var(--pink); }
.cbadge.loom   { background: #020E06; color: var(--green); }
.cbadge.final  { background: #0E0E18; color: var(--text); }
.cchev { font-size: 10px; color: var(--muted); transition: transform 0.2s; flex-shrink: 0; }
.chunk.open .cchev { transform: rotate(180deg); }
.chunk-body { display: none; padding: 18px; background: var(--bg); flex-direction: column; gap: 13px; }
.chunk.open .chunk-body { display: flex; }

/* CODE */
.cw { background: var(--s1); border: 1px solid var(--border); border-radius: 3px; overflow: hidden; }
.cbar { display: flex; align-items: center; justify-content: space-between; padding: 6px 12px; background: var(--s2); border-bottom: 1px solid var(--border); }
.cfile { font-size: 10px; color: var(--muted); letter-spacing: 0.05em; }
.copybtn { font-size: 8px; letter-spacing: 0.08em; text-transform: uppercase; padding: 2px 7px; border: 1px solid var(--bord2); border-radius: 2px; background: transparent; color: var(--muted); cursor: pointer; font-family: inherit; transition: all 0.15s; }
.copybtn:hover { color: var(--text); border-color: var(--muted); }
.copybtn.ok { color: var(--green); border-color: var(--green); }
pre { padding: 14px; overflow-x: auto; font-size: 11.5px; line-height: 1.8; color: var(--text); font-family: 'Martian Mono', monospace; }
.cm { color: #1E1E30; font-style: italic; }
.ck { color: #60A5FA; }
.cv { color: #4ADE80; }
.cs { color: #FCD34D; }
.cf { color: #F87171; }
.cp { color: #C084FC; }
.co { color: var(--gold); }

/* PROSE */
.prose { font-size: 12px; color: #383858; line-height: 1.9; }
.prose strong { color: var(--text); font-weight: 500; }
.prose code { background: var(--s2); border: 1px solid var(--border); padding: 1px 5px; border-radius: 2px; font-size: 11px; color: var(--gold2); }
.prose em { color: #505070; font-style: italic; }

/* ANALOGY */
.analogy { border: 1px solid var(--bord2); border-radius: 3px; overflow: hidden; }
.analogy-head { background: var(--s3); padding: 7px 13px; font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase; border-bottom: 1px solid var(--border); }
.analogy-head.gold  { color: var(--gold2); }
.analogy-head.blog  { color: var(--pink); }
.analogy-head.arch  { color: var(--purple); }
.analogy-body { padding: 12px 14px; font-size: 12px; color: #383858; line-height: 1.9; background: #040406; }
.analogy-body strong { color: #686878; font-weight: 500; }

/* SECTION BLOCK */
.section { border: 1px solid var(--border); border-radius: 3px; overflow: hidden; }
.section-head { padding: 8px 14px; background: var(--s2); border-bottom: 1px solid var(--border); font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase; }
.section-head.gold   { color: var(--gold2); }
.section-head.blue   { color: var(--blue); }
.section-head.green  { color: var(--green); }
.section-head.purple { color: var(--purple); }
.section-head.pink   { color: var(--pink); }
.section-body { padding: 12px 14px; font-size: 12px; color: #383858; line-height: 1.9; background: var(--bg); }
.section-body strong { color: #686878; font-weight: 500; }
.section-body code { background: var(--s2); border: 1px solid var(--border); padding: 1px 5px; border-radius: 2px; font-size: 11px; color: var(--gold2); }

/* WHY */
.why { border-left: 2px solid var(--gold); padding: 11px 14px; background: #080600; border-radius: 0 3px 3px 0; }
.why-lbl { font-size: 8px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold2); margin-bottom: 5px; }
.why p { font-size: 12px; color: #403010; line-height: 1.85; }
.why p strong { color: #806020; font-weight: 500; }

/* CALLOUT */
.callout { border-radius: 3px; padding: 10px 13px; font-size: 12px; line-height: 1.75; display: flex; gap: 9px; align-items: flex-start; }
.callout.gold    { background: #080600; border: 1px solid #302000; color: var(--gold2); }
.callout.info    { background: #030810; border: 1px solid #0C1A40; color: #60A5FA; }
.callout.blog    { background: #0A0408; border: 1px solid #2A0818; color: var(--pink); }
.callout.success { background: #020806; border: 1px solid #082018; color: #4ADE80; }
.cico { font-size: 13px; flex-shrink: 0; margin-top: 1px; }

/* CHECKLIST */
.chklist { display: flex; flex-direction: column; gap: 5px; }
.chk { display: flex; align-items: flex-start; gap: 9px; font-size: 12px; color: #383858; line-height: 1.5; padding: 7px 12px; background: var(--s1); border: 1px solid var(--border); border-radius: 3px; }
.chk .ci { color: var(--green); flex-shrink: 0; }
.chk .ca { color: var(--gold2); flex-shrink: 0; }

/* README STRUCTURE */
.readme-block { border: 1px solid var(--border); border-radius: 3px; overflow: hidden; }
.rb-section { border-bottom: 1px solid var(--border); }
.rb-section:last-child { border-bottom: none; }
.rb-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--s2); border-bottom: 1px solid var(--border); }
.rb-num { width: 20px; height: 20px; border-radius: 2px; background: var(--gold); color: #000; font-size: 9px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.rb-title { font-size: 12px; font-weight: 500; color: #fff; }
.rb-why { font-size: 10px; color: var(--muted); margin-left: auto; }
.rb-body { padding: 10px 14px; font-size: 11.5px; color: #383858; line-height: 1.75; background: var(--bg); }
.rb-body code { background: var(--s2); border: 1px solid var(--border); padding: 1px 5px; border-radius: 2px; font-size: 10px; color: var(--gold2); }

/* BLOG OUTLINE */
.blog-section { border-left: 2px solid var(--pink); padding: 10px 14px; background: #060208; border-radius: 0 3px 3px 0; margin-bottom: 8px; }
.blog-section-title { font-size: 10px; color: var(--pink); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 5px; }
.blog-section-body { font-size: 12px; color: #403050; line-height: 1.8; }
.blog-section-body strong { color: #706080; font-weight: 500; }

/* LOOM TIMELINE */
.loom-row { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); align-items: flex-start; }
.loom-row:last-child { border-bottom: none; }
.loom-time { font-size: 10px; color: var(--green); width: 48px; flex-shrink: 0; margin-top: 1px; }
.loom-content { font-size: 12px; color: #383858; line-height: 1.6; flex: 1; }
.loom-content strong { color: var(--text); font-weight: 500; }

/* CV FINAL TABLE */
.cv-table { border: 1px solid var(--border); border-radius: 3px; overflow: hidden; }
.cv-row { display: grid; grid-template-columns: 80px 1fr; border-bottom: 1px solid var(--border); }
.cv-row:last-child { border-bottom: none; }
.cv-row.head { background: var(--s2); }
.cv-phase { padding: 9px 12px; border-right: 1px solid var(--border); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gold2); display: flex; align-items: center; }
.cv-line { padding: 9px 12px; font-size: 11px; color: #383858; line-height: 1.6; background: var(--bg); }
.cv-line em { color: #505070; font-style: italic; }

/* BOT NAV */
.bot-nav { padding: 14px 36px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); background: var(--s1); flex-shrink: 0; }
.nbtn { display: flex; align-items: center; gap: 7px; font-family: 'Martian Mono', monospace; font-size: 11px; padding: 9px 18px; border: 1px solid var(--bord2); border-radius: 3px; background: transparent; color: var(--text); cursor: pointer; transition: all 0.15s; }
.nbtn:hover { background: var(--s2); border-color: var(--muted); }
.nbtn:disabled { opacity: 0.2; cursor: default; }
.nbtn.primary { background: var(--gold); border-color: var(--gold); color: #000; font-weight: 700; }
.nbtn.primary:hover { background: var(--gold2); border-color: var(--gold2); }
.step-lbl { font-size: 10px; color: var(--muted); letter-spacing: 0.08em; }
</style>
</head>
<body>
<div class="shell">

<aside class="sidebar">
  <div class="sb-head">
    <div class="phase-dot">Phase 7 · Final</div>
    <div class="sb-title">Portfolio Polish</div>
    <div class="sb-pills">
      <span class="pill week">Week 11–12</span>
      <span class="pill doc">Docs</span>
      <span class="pill blog">Blog</span>
      <span class="pill cv">CV</span>
    </div>
  </div>
  <div class="prog-wrap">
    <div class="prog-row"><span>progress</span><span id="prog-txt">0 / 8</span></div>
    <div class="prog-track"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
  </div>
  <nav class="nav-scroll" id="nav-scroll"></nav>
</aside>

<div class="main">
  <div class="main-head" id="main-head"></div>
  <div class="content" id="content"></div>
  <div class="bot-nav">
    <button class="nbtn" id="btn-prev" onclick="go(-1)">← prev</button>
    <span class="step-lbl" id="step-lbl"></span>
    <button class="nbtn primary" id="btn-next" onclick="go(1)">next →</button>
  </div>
</div>

</div>
<script>
const STEPS = [

// ── 0 ─────────────────────────────────────────────────────
{
  title:"Why Phase 7 exists", sub:"overview",
  eyebrow:"Phase 7 · Overview", headline:"Portfolio Polish",
  desc:"You have built a production-grade DevOps platform across 6 phases. Phase 7 does not add new technology. It makes everything you built legible to a hiring manager in 5 minutes, to a technical interviewer in 30 minutes, and to the internet forever via a blog post. Presentation is not vanity — it is how you convert 12 weeks of work into offers.",
  tags:["doc","arch","blog","cv","loom"],
  tag:"final",
  chunks:[
    {
      dot:"concept", label:"What Phase 7 produces — the five deliverables", badge:"overview", bt:"concept",
      body:`<div class="chklist">
<div class="chk"><span class="ca">1</span><strong style="color:var(--text)">Architecture diagram</strong> — one image that shows the entire system. Hiring managers look at this first. It must be readable in 30 seconds.</div>
<div class="chk"><span class="ca">2</span><strong style="color:var(--text)">README</strong> — structured like a technical proposal. Problem → architecture → security → how to deploy. Engineers read this during interviews.</div>
<div class="chk"><span class="ca">3</span><strong style="color:var(--text)">Cost estimate</strong> — shows business awareness. Senior DevOps engineers think about cost. Juniors do not.</div>
<div class="chk"><span class="ca">4</span><strong style="color:var(--text)">Loom walkthrough</strong> — 3 min live demo video. Proves it actually runs. Hiring managers watch this while reviewing your CV.</div>
<div class="chk"><span class="ca">5</span><strong style="color:var(--text)">Technical blog post</strong> — the most underrated asset. Shows communication skill. Gets you discovered. Signals you can think, not just execute.</div>
</div>`
    },
    {
      dot:"concept", label:"The hiring manager's 5-minute review — what they actually look at", badge:"concept", bt:"concept",
      body:`<div class="analogy">
  <div class="analogy-head gold">What happens when your CV lands on a desk</div>
  <div class="analogy-body">
    A hiring manager opens your GitHub profile. They have 5 minutes. Here is exactly what they look at and in what order:<br><br>
    <strong>1.</strong> README header — does the project title tell them what it is immediately?<br>
    <strong>2.</strong> Architecture diagram — can they understand the system in 30 seconds?<br>
    <strong>3.</strong> Tech stack badges — do the right tools appear?<br>
    <strong>4.</strong> README structure — does it look professional or like a personal notebook?<br>
    <strong>5.</strong> Last commit date — is it recent? Is the author still active?<br>
    <strong>6.</strong> If interested: Loom video — does it actually work?<br><br>
    They do NOT read your code in the first pass. They read the documentation first. Documentation is the interface to your code.
  </div>
</div>`,
      why:"Most engineers build the project and write a 3-line README. The documentation is the difference between a portfolio project and a portfolio project that gets you interviews. <strong>Spend as much time on Phase 7 as on any technical phase.</strong>"
    }
  ]
},

// ── 1 ─────────────────────────────────────────────────────
{
  title:"Architecture diagram", sub:"visual design",
  eyebrow:"Step 1", headline:"Draw the architecture diagram",
  desc:"One diagram that communicates the entire system to a technical reader in 30 seconds. Every component visible. Traffic flows shown. Security boundaries clear. This is the first thing an interviewer asks you to walk through.",
  tags:["arch","doc"],
  tag:"arch",
  chunks:[
    {
      dot:"arch", label:"What the diagram must show — the checklist", badge:"arch", bt:"arch",
      body:`<div class="chklist">
<div class="chk"><span class="ci">✓</span>AWS region boundary and VPC boundary clearly labelled</div>
<div class="chk"><span class="ci">✓</span>Three subnet tiers (public / private / data) with CIDR blocks</div>
<div class="chk"><span class="ci">✓</span>All EC2 instances, EKS nodes, RDS, ALB, NAT Gateway, Bastion</div>
<div class="chk"><span class="ci">✓</span>Traffic flow arrows: internet → ALB → EKS pods → RDS</div>
<div class="chk"><span class="ci">✓</span>CI/CD flow: GitHub Actions → ECR → ArgoCD → EKS</div>
<div class="chk"><span class="ci">✓</span>Observability stack: Prometheus scraping pods, Loki collecting logs, Grafana reading both</div>
<div class="chk"><span class="ci">✓</span>Security gates labelled: Trivy, Checkov, SonarQube at their positions in the pipeline</div>
<div class="chk"><span class="ci">✓</span>AWS managed services in their own column: S3, DynamoDB, ECR, IAM, Secrets Manager</div>
<div class="chk"><span class="ci">✓</span>Ansible SSH path: laptop → bastion → private EC2s</div>
</div>`
    },
    {
      dot:"arch", label:"Tool recommendation — draw.io / diagrams.net", badge:"do this", bt:"do",
      body:`<div class="prose">Use <strong>diagrams.net</strong> (formerly draw.io). It is free, works in the browser, exports to PNG/SVG, and has AWS shape libraries built in.</div>
<div class="cw"><div class="cbar"><span class="cfile">setup</span></div><pre>
1. Go to app.diagrams.net
2. Create new diagram → select "AWS 19" template as starting point
3. Enable AWS shape library: Extras → Edit Diagram → or via left panel

<span class="cm"># Export settings for README:</span>
File → Export as → PNG
  Scale: 2x (for retina displays)
  Background: white or transparent

<span class="cm"># Save the .drawio source file in your repo too:</span>
docs/
  architecture.drawio   ← editable source
  architecture.png      ← rendered image (linked in README)
</pre></div>`,
      why:"Saving the .drawio source file in the repo is a professional signal. It means someone can open the diagram, modify it for their context, and understand the system. A PNG alone is a dead artifact. The source file shows you think in systems."
    },
    {
      dot:"arch", label:"Diagram layout — where to place each element", badge:"arch", bt:"arch",
      body:`<div class="cw"><div class="cbar"><span class="cfile">diagram layout guide</span></div><pre>
LEFT COLUMN: CI/CD + GitOps
  Developer laptop
    ↓ git push
  GitHub (app repo)
    ↓ GitHub Actions
  ECR (image store)
    ↓
  gitops-config repo
    ↓ ArgoCD watches

# Production GitOps Platform on AWS

> A fully automated, production-grade DevOps platform built on AWS:
> Kubernetes (EKS) · Helm · ArgoCD GitOps · Prometheus/Grafana/Loki
> observability · Trivy/Checkov/SonarQube security pipeline

![CI](https://github.com/YOUR_USERNAME/devops-platform/actions/workflows/ci.yml/badge.svg)
![Terraform](https://img.shields.io/badge/Terraform-1.7-7B42BC)
![Kubernetes](https://img.shields.io/badge/Kubernetes-1.29-326CE5)
![ArgoCD](https://img.shields.io/badge/ArgoCD-2.10-EF7B4D)

![Architecture](docs/architecture.png)

## Tech Stack

| Layer            | Tool                            |
|------------------|---------------------------------|
| Cloud            | AWS (EKS, ECR, RDS, ALB, S3)   |
| IaC              | Terraform (modular, remote state)|
| Config Mgmt      | Ansible (dynamic inventory)     |
| Containers       | Docker multi-stage builds       |
| Orchestration    | Kubernetes (EKS)                |
| Package Mgmt     | Helm charts                     |
| GitOps CD        | ArgoCD (App of Apps)            |
| CI               | GitHub Actions + OIDC           |
| Metrics          | Prometheus + Grafana            |
| Logs             | Loki + Promtail                 |
| Alerting         | Alertmanager → Slack            |
| Image Scanning   | Trivy (CVE blocking)            |
| IaC Scanning     | Checkov (misconfiguration)      |
| Code Quality     | SonarCloud (quality gate)       |
| Secrets          | AWS Secrets Manager             |

## Key Features

- **Zero-downtime deployments** via Helm rolling update strategy
- **GitOps delivery** — git revert = instant rollback, no kubectl needed
- **OIDC authentication** — no long-lived AWS keys in CI
- **CVE blocking** — CRITICAL/HIGH vulnerabilities prevent ECR push
- **Self-healing cluster** — ArgoCD reverts manual changes automatically
- **Full observability** — metrics, logs, and alerts in unified Grafana UI
- **IAM least privilege** — all roles scoped to specific resource ARNs

## Architecture

The platform is divided into 7 layers built sequentially:

1. **Network** — VPC with 3 subnet tiers, NAT, ALB, bastion
2. **Compute** — EKS cluster, EC2 nodes, Ansible configuration
3. **CI** — GitHub Actions: test → scan → build → push to ECR
4. **CD** — ArgoCD GitOps: config repo → render Helm → apply to cluster
5. **Observability** — kube-prometheus-stack + Loki + Grafana dashboards
6. **Security** — Trivy, Checkov, SonarCloud, IAM audit, secrets management
7. **Documentation** — architecture diagram, runbooks, cost estimate

## Prerequisites

- Terraform >= 1.7
- kubectl >= 1.29
- Helm >= 3.14
- AWS CLI >= 2.0 (configured with appropriate IAM permissions)
- Python >= 3.9 (for Ansible)

## Getting Started

\`\`\`bash
# 1. Clone
git clone https://github.com/YOUR_USERNAME/devops-platform
cd devops-platform

# 2. Bootstrap remote state (one time)
cd scripts && ./bootstrap-state.sh

# 3. Configure variables
cp terraform/terraform.tfvars.example terraform/terraform.tfvars
# Edit terraform.tfvars with your values

# 4. Deploy infrastructure
cd terraform
terraform init && terraform apply

# 5. Configure servers
cd ansible
ansible-playbook playbooks/app_servers.yml

# 6. Deploy ArgoCD and bootstrap GitOps
kubectl apply -f gitops-config/apps/app-of-apps.yaml

# 7. Verify
kubectl get pods --all-namespaces
argocd app list
\`\`\`

## Security

- **No stored AWS credentials** — GitHub Actions uses OIDC role assumption
- **Image CVE blocking** — Trivy blocks CRITICAL/HIGH before ECR push
- **IaC scanning** — Checkov gates all Terraform changes in CI
- **Code quality gate** — SonarCloud blocks PRs with new vulnerabilities
- **Secrets management** — all credentials in AWS Secrets Manager, retrieved via IAM role
- **IAM least privilege** — custom policies scoped to specific resource ARNs
- **SSH hardening** — bastion-only entry, PasswordAuthentication disabled
- **Pre-commit hooks** — detect-secrets prevents credential commits

## Observability

- **Grafana dashboards**: cluster overview, app performance (RPS / error rate / p99 latency)
- **Loki**: all pod logs searchable by namespace, pod, container, log level
- **Alert rules**: high error rate, p99 latency, pod crash-loop, memory pressure (→ Slack)
- **Custom metrics**: HTTP request counter + latency histogram via prom-client

## Cost Estimate (approximate)

| Resource        | Monthly cost |
|-----------------|-------------|
| EKS cluster     | ~$73        |
| EC2 nodes (x2 t3.medium) | ~$60 |
| RDS t3.medium   | ~$50        |
| ALB             | ~$20        |
| NAT Gateway     | ~$35        |
| S3 + misc       | ~$10        |
| **Total**       | **~$248/mo**|

*Costs reducible to ~$60/mo for learning by using t3.micro nodes and stopping when not in use.*
</pre></div>`

      dot:"cv", label:"The questions you will be asked — and your answers", badge:"concept", bt:"concept",
      body:`<div class="cw"><div class="cbar"><span class="cfile">interview Q&A from your project</span></div><pre>
<span class="co">Q: How does your CI/CD pipeline work?</span>
A: GitHub Actions runs on push: tests → Trivy filesystem scan →
   SonarCloud quality gate → Docker build → Trivy image scan →
   push to ECR → update gitops-config repo image tag → ArgoCD
   detects change → renders Helm chart → rolling update on EKS.
   CI never touches the cluster. ArgoCD is the only thing that deploys.

<span class="co">Q: How do you handle secrets in your pipeline?</span>
A: GitHub Actions authenticates to AWS via OIDC role assumption —
   no access keys stored anywhere. App secrets are in AWS Secrets
   Manager, fetched at runtime via EC2/pod IAM role. pre-commit
   hooks run detect-secrets to prevent accidental commits.

<span class="co">Q: What happens when a deployment goes wrong?</span>
A: git revert on the gitops-config repo. ArgoCD detects the new
   commit, re-renders the Helm chart with the previous image tag,
   and applies a rolling update back to the known-good version.
   Full audit trail in Git. No manual kubectl involved.

<span class="co">Q: How do you monitor the system?</span>
A: Prometheus scrapes metrics via ServiceMonitor CRDs every 15s.
   Custom app metrics exposed via prom-client: HTTP request counter
   and latency histogram. Grafana dashboards show RPS, error rate,
   p50/p95/p99 latency. Loki aggregates pod logs via Promtail
   DaemonSet. Alertmanager routes to Slack by severity.

<span class="co">Q: Explain GitOps to me.</span>
A: Git is the single source of truth for cluster state. An agent
   (ArgoCD) inside the cluster polls a config repo and continuously
   reconciles cluster state to match Git. If someone manually
   changes something in the cluster, ArgoCD detects drift and reverts
   it within 3 minutes. Rollback is git revert. Audit trail is git log.

<span class="co">Q: How is your Terraform structured?</span>
A: Module-per-concern: networking, security-groups, compute, data, iam,
   eks. Root main.tf calls modules and passes outputs between them.
   Remote state in S3 with DynamoDB locking. default_tags block
   auto-tags every resource. tfvars gitignored. CI runs Checkov
   before terraform plan.

<span class="co">Q: Walk me through your security model.</span>
A: Five layers: 1) OIDC auth — no long-lived keys. 2) Trivy —
   CVEs blocked before ECR push. 3) Checkov — misconfigs blocked
   before terraform apply. 4) IAM least privilege — scoped policies,
   not managed AdministratorAccess. 5) Secrets Manager — no secrets
   on disk or in env files. Plus bastion-only SSH, SSH hardening,
   pre-commit secret detection.
</pre></div>`

      dot:"cv", label:"Questions that trip people up — prepare these specifically", badge:"concept", bt:"concept",
      body:`<div class="cw"><div class="cbar"><span class="cfile">harder questions — prepare these</span></div><pre>
<span class="co">Q: What's the difference between liveness and readiness probes?</span>
A: Liveness — if this fails, restart the pod. Readiness — if this
   fails, stop sending traffic to this pod but don't restart it.
   A pod that's starting up should fail readiness until warmed up.
   A pod in a bad state (deadlock) should fail liveness to restart.

<span class="co">Q: Why did you use a separate gitops-config repo?</span>
A: Three reasons: 1) Deploy is a deliberate act separate from code
   merge. 2) Config history is a clean audit trail — git log shows
   every deploy with timestamp and deployer. 3) CI only needs write
   access to the config repo, not the cluster — smaller blast radius
   if CI is compromised.

<span class="co">Q: What does ArgoCD selfHeal actually do?</span>
A: ArgoCD polls the cluster every 3 minutes. It compares live cluster
   state to the rendered Helm chart from Git. If they differ — even
   from a manual kubectl change — it re-applies the Git version.
   The cluster converges to Git. You cannot accidentally leave the
   cluster in an unknown state.

<span class="co">Q: Why use Loki instead of Elasticsearch?</span>
A: Loki only indexes labels (pod, namespace, app) — not log content.
   Content is stored compressed in S3. This makes storage 10x cheaper.
   For Kubernetes, you almost always know which pod you care about —
   label filtering gets you there fast, then grep the content.
   ELK is better for full-text search across millions of events.

<span class="co">Q: How would you scale this for 10 teams?</span>
A: ArgoCD ApplicationSets to template Applications per team. Separate
   namespaces per team with RBAC. Separate gitops-config paths per
   team. Shared monitoring namespace with per-namespace Grafana
   datasources. Checkov policies enforced centrally in CI.
</pre></div>`,

let cur = 0;
const done = new Set();

function renderNav() {
  document.getElementById('nav-scroll').innerHTML = STEPS.map((s,i) => `
    <div class="nav-item ${i===cur?'active':''} ${done.has(i)?'done':''}" onclick="jump(${i})">
      <div class="nn">${done.has(i)?'✓':i+1}</div>
      <div class="nt">
        <div class="ntitle">${s.title}</div>
        <div class="nsub">${s.sub}</div>
      </div>
      <div class="ntag ${s.tag}">${s.tag}</div>
    </div>
  `).join('');
  const pct = Math.round(done.size/STEPS.length*100);
  document.getElementById('prog-fill').style.width=pct+'%';
  document.getElementById('prog-txt').textContent=`${done.size} / ${STEPS.length}`;
}

function renderMain() {
  const s = STEPS[cur];
  document.getElementById('main-head').innerHTML=`
    <div class="eyebrow">${s.eyebrow}</div>
    <div class="headline">${s.headline}</div>
    <div class="step-desc">${s.desc}</div>
    <div class="tag-row">${s.tags.map(t=>`<span class="tag ${t}">${t}</span>`).join('')}</div>
  `;
  document.getElementById('content').innerHTML=s.chunks.map((c,ci)=>`
    <div class="chunk ${ci===0?'open':''}" id="c${ci}">
      <div class="chunk-head" onclick="tog(${ci})">
        <div class="cdot ${c.dot}"></div>
        <span class="clabel">${c.label}</span>
        <span class="cbadge ${c.bt}">${c.badge}</span>
        <span class="cchev">▼</span>
      </div>
      <div class="chunk-body">
        ${c.body}
        ${c.why?`<div class="why"><div class="why-lbl">why this matters</div><p>${c.why}</p></div>`:''}
      </div>
    </div>
  `).join('');
  document.getElementById('step-lbl').textContent=`step ${cur+1} of ${STEPS.length}`;
  document.getElementById('btn-prev').disabled=cur===0;
  document.getElementById('btn-next').textContent=cur===STEPS.length-1?'✓ complete':'next →';
}

function tog(ci){document.getElementById(`c${ci}`).classList.toggle('open');}

function go(dir){
  if(dir===1&&cur<STEPS.length-1){done.add(cur);cur++;}
  else if(dir===-1&&cur>0)cur--;
  renderNav();renderMain();
  document.querySelector('.main').scrollTop=0;
}

function jump(i){
  if(i<cur)done.delete(i);
  cur=i;renderNav();renderMain();
}

function cp(btn){
  const pre=btn.closest('.cw').querySelector('pre');
  navigator.clipboard.writeText(pre.innerText).then(()=>{
    btn.textContent='copied!';btn.classList.add('ok');
    setTimeout(()=>{btn.textContent='copy';btn.classList.remove('ok');},2000);
  });
}

renderNav();renderMain();
</script>
